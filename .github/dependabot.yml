version: 2
updates:
  # As dependências são fixadas com `==` (ver requirements*.txt), então cada PR
  # do Dependabot representa uma mudança real de versão — e passa pelo CI antes
  # de entrar. O agrupamento evita a enxurrada de um PR por pacote.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

# Adicionar como .github/workflows/ci.yml
# Serve para: oil-gas-financial-dashboard, vendas-liquidos, projeto_bloomberg, resumo-focus-public
name: CI

# `data.js` e `noticias.json` sao saida de rotina, nao codigo, e ficam na raiz —
# por isso escapavam do `data/**`. Sem eles na lista, cada commit diario da
# rotina disparava a suite inteira sobre um diff que nao tem como quebra-la.
# Se o mesmo push mexer em codigo, o CI roda normalmente: `paths-ignore` so pula
# quando *tudo* o que veio no push esta na lista.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "output/**"
      - "data.js"
      - "noticias.json"
  pull_request:
    paths-ignore:
      - "data/**"
      - "docs/**"
      - "output/**"
      - "data.js"
      - "noticias.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          pip install -r requirements-dev.txt

      - name: Lint (ruff) — informativo
        continue-on-error: true
        run: ruff check --output-format=github .

      - name: Formatacao (ruff) — informativo
        continue-on-error: true
        run: ruff format --check .

      - name: Testes (pytest)
        run: pytest

name: Atualiza dashboard PETR4

# Toda rodada agendada cai com a bolsa fechada. A B3 negocia das 10:00 às 17:00
# em Brasília (13:00–20:00 UTC), com after-market até 17:55. O minuto fora de
# :00 e :30 é de propósito: são os mais disputados na fila do GitHub Actions, e
# aqui o atraso de enfileiramento já chegou a horas — por isso nenhum horário
# aqui pode estar a menos de algumas horas da abertura seguinte.
on:
  schedule:
    # 21:47 UTC = 18:47 em Brasília, de segunda a sexta. A rodada principal:
    # pregão encerrado, after-market encerrado, dia consolidado.
    - cron: "47 21 * * 1-5"
    # 23:47 UTC = 20:47 em Brasília, do mesmo dia. Repescagem para quando a
    # fonte ainda não tinha o pregão às 18:47 — acontece. Se a primeira rodada
    # publicou, esta não encontra mudança em data.js e termina sem commitar.
    - cron: "47 23 * * 1-5"
    # 11:13 UTC de sábado = 08:13 em Brasília, com a bolsa fechada o dia
    # inteiro. Última rede para o pregão de sexta, se as duas de sexta falharem.
    # Os três horários ficam fora da janela 13:00–20:00 UTC de propósito: assim
    # um erro no campo de dia da semana não coloca rodada nenhuma dentro do
    # pregão.
    - cron: "13 11 * * 6"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Publicar mesmo com a bolsa operando (o dia ainda vai mudar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atualiza-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Detecta cedo se os secrets de e-mail existem. Os passos de e-mail só
      # rodam quando existem — sem continue-on-error, que mascarava qualquer
      # falha real de SMTP (senha expirada, bloqueio do Gmail etc.).
      - name: Verifica secrets de e-mail
        id: mail
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets MAIL_USERNAME/MAIL_PASSWORD ausentes — e-mails não serão enviados."
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # A rotina do dashboard depende apenas de `requests`. O pipeline ETL da
      # Alpha Vantage (pandas, dotenv) não roda aqui.
      #
      # Saída 9 é a desistência deliberada: a bolsa ainda estava operando e nada
      # foi escrito. Não é falha — o job segue verde e os passos seguintes são
      # pulados, para que a desistência não vire e-mail de erro nem e-mail de
      # fechamento repetido. Qualquer outro código diferente de zero continua
      # derrubando o job.
      - name: Atualiza dados
        id: dados
        env:
          FORCAR_PREGAO_ABERTO: ${{ inputs.forcar && '1' || '' }}
        run: |
          pip install -r requirements-dashboard.txt
          set +e
          python scripts/update_dashboard.py
          codigo=$?
          set -e
          if [ "$codigo" -eq 9 ]; then
            echo "pulou=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pregão em curso — rodada encerrada sem publicar nada."
            exit 0
          fi
          exit "$codigo"

      - name: Commita se houver mudança
        if: steps.dados.outputs.pulou != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js noticias.json
          if git diff --cached --quiet; then
            echo "Sem mudanças em data.js."
          else
            git commit -m "Atualiza dados do dashboard (pregão de $(python scripts/emit_summary.py | sed -n 's/^last_date=//p'))"
            # A rotina roda em paralelo com commits manuais; um rebase evita
            # falha de push por non-fast-forward.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Extrai resumo para o e-mail
        id: resumo
        if: steps.dados.outputs.pulou != 'true'
        run: python scripts/emit_summary.py >> "$GITHUB_OUTPUT"

      - name: Envia e-mail com o dashboard
        if: success() && steps.mail.outputs.ok == 'true' && steps.dados.outputs.pulou != 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "PETR4 R$ ${{ steps.resumo.outputs.last_close }} (${{ steps.resumo.outputs.var_dia }}% no dia) — pregão de ${{ steps.resumo.outputs.last_date }}"
          to: jmagomez@gmail.com
          from: "Projeto Bloomberg <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <h2 style="margin-bottom:4px">PETR4 — pregão de ${{ steps.resumo.outputs.last_date }}</h2>
            <p style="margin:0 0 16px;font-size:28px;font-weight:600;color:${{ steps.resumo.outputs.cor_dia }}">
              R$ ${{ steps.resumo.outputs.last_close }}
              <span style="font-size:16px">${{ steps.resumo.outputs.seta_dia }} ${{ steps.resumo.outputs.var_dia }}% no dia</span>
            </p>
            <table cellpadding="6" style="border-collapse:collapse;font-size:14px">
              <tr><td>Abertura</td><td align="right"><b>R$ ${{ steps.resumo.outputs.day_open }}</b></td></tr>
              <tr><td>Máxima do dia</td><td align="right"><b>R$ ${{ steps.resumo.outputs.day_high }}</b></td></tr>
              <tr><td>Mínima do dia</td><td align="right"><b>R$ ${{ steps.resumo.outputs.day_low }}</b></td></tr>
              <tr><td>Fechamento anterior</td><td align="right">R$ ${{ steps.resumo.outputs.prev_close }}</td></tr>
              <tr><td>Volume do dia</td><td align="right">${{ steps.resumo.outputs.day_volume }} M</td></tr>
              <tr><td>Variação na semana</td><td align="right">${{ steps.resumo.outputs.var_semana }}%</td></tr>
              <tr><td>Proventos (12 meses)</td><td align="right">${{ steps.resumo.outputs.div_yield }}%</td></tr>
              <tr><td>Retorno total desde 2010</td><td align="right">${{ steps.resumo.outputs.ret_annual }}% a.a.</td></tr>
              <tr><td>Máxima histórica · mínima</td><td align="right">R$ ${{ steps.resumo.outputs.max_high }} · R$ ${{ steps.resumo.outputs.min_low }}</td></tr>
            </table>
            <p style="margin-top:16px"><a href="https://jmagomez.github.io/projeto_bloomberg/">Abrir o dashboard completo</a> — candles diários e semanais, suporte/resistência, tendência, médias móveis, RSI, proventos e volume.</p>
            <p style="color:#888;font-size:12px">${{ steps.resumo.outputs.days }} pregões desde 2010 · fonte: Yahoo Finance · rotina automática via GitHub Actions · não é recomendação de investimento</p>

      - name: Notifica falha por e-mail
        if: failure() && steps.mail.outputs.ok == 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "⚠️ Rotina do dashboard PETR4 falhou (run ${{ github.run_number }})"
          to: jmagomez@gmail.com
          from: "Projeto Bloomberg <${{ secrets.MAIL_USERNAME }}>"
          body: |
            A rotina do dashboard PETR4 falhou e NADA foi publicado — o dashboard
            segue exibindo o último dado íntegro.

            Causa mais provável: a fonte (Yahoo Finance) respondeu sem o último
            pregão fechado, e a rotina se recusa a publicar dado defasado.
            Nesse caso, basta reexecutar o workflow manualmente mais tarde.

            Log completo: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
